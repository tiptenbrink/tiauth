[package]
name = "tiauth-core"
version = "0.2.0"
authors = ["Tip ten Brink <75669206+tiptenbrink@users.noreply.github.com>"]
edition = "2021"

[dependencies]
redb = { version = "2.1.1", optional = true }
opaque-borink = { version = "0.4.0", optional = true}
rand = "0.8"
hex = "0.4.3"
rmp = "0.8"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
terrors = "=0.3.0"
base64 = "0.22.1"
thiserror = "1.0"
ed25519-compact = "=2.1.1"
aes-gcm-siv = "=0.11.1"
zerovec = { version = "0.10.4", features = ["serde", "derive"] }
tempfile = { version = "3", optional = true }
rayon = "1.10"
# systemtime doesn't work on wasm, but we rely on it for creating proofs
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1.1"

[features]
default = ["action"]
action = ["dep:redb", "dep:opaque-borink"]
app = []
test = ["dep:tempfile"]

[dev-dependencies]
criterion = "0.5"
tiauth-core = { path = ".", features = ["test", "action", "app"] }

[[bench]]
name = "deser"
harness = false
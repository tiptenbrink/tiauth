[package]
name = "tiauth-app-js"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiauth-core = { path = "../tiauth-core" }
tiauth-app = { path = "../tiauth-app" }
tiauth-server = { path = "../tiauth-server", features = ["functions"] }

lazy-borink = { path = "../../lazy-borink/lazy-borink", version = "0.2"}

getrandom = { version = "0.2", features = ["js", "wasm-bindgen"] }
# rand = { version = "0.8.5" }

base64 = "0.22"
terrors = "=0.3.0"
thiserror = "1"


wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
tsify = { version = "0.4.5", features = ["js"] }
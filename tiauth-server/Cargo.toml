[package]
name = "tiauth-server"
version = "0.2.0"
edition = "2021"

[dependencies]
tiauth-core = { path="../tiauth-core", default-features = false }
redb = { version = "2.1.1", optional = true }
axum = { version = "0.7.5", features = ["macros"], optional = true}
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["timeout", "trace"], optional = true}
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"], optional = true}
rand = "0.8"
terrors = "=0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bytes =  { version = "1", optional = true }
rmp = "0.8"
rmp-serde = "1.3.0"
base64 = "0.22.1"
serde_json = "1.0"
blocking = "1.6.1"
ambassador = "0.4.1"
parking_lot = "0.12.3"
crossbeam = "0.8.4"
tracing = "=0.1.40"

[features]
default = ["router"]
model = []
functions = ["model", "tiauth-core/action", "dep:redb"]
admin = []
# Look at admin TODO
router = ["functions", "admin", "dep:axum", "dep:tower-http", "dep:bytes", "dep:tokio"]

[package]
name = "tiauth-server"
version = "0.2.0"
edition = "2021"

[dependencies]
tiauth-core = { path="../tiauth-core" }
lazy-borink = "0.1.0"
redb = "2.1.1"
axum = "0.7.5"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
rand = "0.8"
terrors = "=0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bytes = "1"
rmp = "0.8"
rmp-serde = "1.3.0"
base64 = "0.22.1"

[features]
default = ["router"]
functions = []
admin = []
# Look at admin TODO
router = ["functions", "admin"]

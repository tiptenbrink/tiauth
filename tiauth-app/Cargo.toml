[package]
name = "tiauth-app"
version = "0.2.0"
edition = "2021"

[dependencies]
tiauth-core = { path = "../tiauth-core", default-features = false, features = ["app"] }
tiauth-server = { path = "../tiauth-server", default-features = false, features = ["model"] }
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
rand = "0.8"
terrors = "=0.3.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12.5", default-features = false, features = ["h2", "rustls-tls", "charset", "macos-system-configuration", "json"] }
opaque-borink = "0.4.0"
rmp-serde = "1.3.0"
base64 = "0.22"
rand_chacha = "0.3.1"
sha2 = "0.10.8"
[package]
name = "tiauth-app-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_internal"
crate-type = ["cdylib"]

[dependencies]
tiauth-core = { path = "../tiauth-core", default-features = false, features = ["app"]}
# tiauth-app = { path = "../tiauth-app" }
# tiauth-server = { path = "../tiauth-server", features = ["functions"] }

# lazy-borink = { path = "../../lazy-borink/lazy-borink", version = "0.2", features = ["python"] }

base64 = "0.22"
rmp = "0.8"
rmp-serde = "1.3.0"
terrors = "=0.3.0"
# serde = { version = "1.0", features = ["derive"] }
# rand = "0.8"
# opaque-borink = "0.4.0"


[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
[project]
name = "tiauth-app-py"
version = "0.2.0"
description = "Python application library for tiauth."
readme = "README.md"
requires-python = ">=3.9, <3.13"
license = {text = "Apache-2.0"}
authors = [
    {email = "75669206+tiptenbrink@users.noreply.github.com"},
    {name = "Tip ten Brink"}
]

[tool.maturin]
python-source = "python"
module-name = "tiauth_app_py"

[tool.poetry]
name = "tiauth-app-py"
version = "0.2.0"
description = "Python application library for tiauth."
authors = ["Tip ten Brink <75669206+tiptenbrink@users.noreply.github.com>"]
license = "Apache-2"
packages = [
    { include = "tiauth_app_py", from = "python" },
]

[tool.poetry.dependencies]
python = ">= 3.9, <3.13"
opaquepy = "0.3.5"
httpx = "0.27.0"
msgspec = "^0.18.6"

[tool.poetry.dev-dependencies]
pytest = "^7.4.2"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend ="maturin"

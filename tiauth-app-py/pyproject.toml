[project]
name = "tiauth-app-py"
version = "0.2.0"
description = "Python application library for tiauth."
readme = "README.md"
requires-python = ">=3.9, <3.13"
license = {text = "Apache-2.0"}
authors = [
    {email = "75669206+tiptenbrink@users.noreply.github.com"},
    {name = "Tip ten Brink"}
]
dependencies = [
    "opaquepy>=0.3.5",
    "httpx>=0.27.0",
    "msgspec>=0.18.6",
]

[tool.uv]
dev-dependencies = [
  "pytest >=8.2.2,<9"
]

[tool.hatch.build]
packages = ["python/tiauth_app_py"]

[tool.maturin]
python-source = "python"
module-name = "tiauth_app_py._internal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
